<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Culture</title>
<meta name="description" content="What colleges are actually like, written for high schoolers. Not rankings, not advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="band home">
  <div class="wrap">
    <div class="bar">
      <span class="wordmark">College Culture</span>
      <span class="small on-muted">New England</span>
    </div>
    <p class="vibe-line">What schools are actually like, from the people who go there. Not rankings, not advice.</p>
  </div>
</header>

<main class="wrap">
  <div class="search">
    <label class="small muted" for="school-search">Find a school</label>
    <input id="school-search" type="search" placeholder="Name or town" autocomplete="off">
  </div>
  <p class="small muted" id="no-match" hidden>No schools match that. Try a town or a shorter name.</p>
  <div class="states" id="schools-wrap"></div>
</main>

<footer>
  <div class="wrap small muted">
    <p>© 2026 College Culture</p>
  </div>
</footer>

<script src="schools/index.js"></script>
<script>
(function () {
  var STATES = { MA: 'Massachusetts', NH: 'New Hampshire', RI: 'Rhode Island', CT: 'Connecticut', VT: 'Vermont', ME: 'Maine' };
  var order = window.SCHOOL_ORDER || [];
  function rank(s) { var i = order.indexOf(s.id); return i === -1 ? 9999 : i; }
  var main = document.getElementById('schools-wrap');
  var groups = {};
  (window.SCHOOL_LIST || []).forEach(function (s) {
    var code = (s.location.split(', ')[1] || '').trim();
    (groups[code] = groups[code] || []).push(s);
  });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  Object.keys(STATES).filter(function (c) { return groups[c]; }).forEach(function (code) {
    var list = groups[code].sort(function (a, b) { return rank(a) - rank(b) || a.name.localeCompare(b.name); });
    var details = el('details', 'state');
    var summary = el('summary');
    var title = el('span', 'sum-text');
    title.append(el('span', 'sum-title', STATES[code]), el('span', 'small muted state-count', list.length + ' schools'));
    var chev = el('span', 'chev');
    chev.setAttribute('aria-hidden', 'true');
    summary.append(title, chev);

    var row = el('ul', 'school-list');
    list.forEach(function (s) {
      var a = el('a');
      a.href = 'school.html#' + encodeURIComponent(s.id);
      var chip = el('span', 'chip');
      chip.style.background = 'linear-gradient(' + s.band + ' 70%, ' + s.stripe + ' 70%)';
      var text = el('span', 'sum-text');
      text.append(el('span', 'school-name', s.name), el('span', 'small muted', s.location));
      var go = el('span', 'chev');
      go.setAttribute('aria-hidden', 'true');
      a.append(chip, text, go);
      var li = el('li');
      li.dataset.search = (s.name + ' ' + s.id.replace(/-/g, ' ') + ' ' + s.location + ' ' + STATES[code]).toLowerCase();
      li.appendChild(a);
      row.appendChild(li);
    });
    details.append(summary, row);
    main.appendChild(details);
  });

  var input = document.getElementById('school-search');
  var empty = document.getElementById('no-match');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    var shown = 0;
    main.querySelectorAll('details').forEach(function (group) {
      var visible = 0;
      group.querySelectorAll('li').forEach(function (li) {
        var match = !q || li.dataset.search.indexOf(q) !== -1;
        li.hidden = !match;
        if (match) visible++;
      });
      group.hidden = visible === 0;
      group.open = !!q && visible > 0;
      shown += visible;
    });
    empty.hidden = shown !== 0;
  });
})();
</script>
</body>
</html>
