<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Culture</title>
<meta name="description" content="What colleges are actually like, written for high schoolers. Not rankings, not advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="bar">
      <span class="wordmark">College Culture</span>
    </div>
    <h1>New England<span class="sub">Schools</span></h1>
    <p class="vibe-line">What schools are actually like, from the people who go there. Not rankings and not advice. Use it to get a feel, then go visit.</p>
  </div>
</header>

<main class="wrap">
  <div class="search">
    <label class="small muted" for="school-search">Find a school</label>
    <input id="school-search" type="search" placeholder="Name or town" autocomplete="off">
  </div>
  <p class="small muted" id="no-match" hidden>No schools match that. Try a town or a shorter name.</p>
  <div id="schools-wrap"></div>
</main>

<footer>
  <div class="wrap small muted">
    <p>© 2026 College Culture</p>
  </div>
</footer>

<script src="schools/index.js"></script>
<script>
(function () {
  var STATES = { MA: 'Massachusetts', NH: 'New Hampshire', RI: 'Rhode Island', CT: 'Connecticut', VT: 'Vermont', ME: 'Maine' };
  var main = document.getElementById('schools-wrap');
  var groups = {};
  (window.SCHOOL_LIST || []).forEach(function (s) {
    var code = (s.location.split(', ')[1] || '').trim();
    (groups[code] = groups[code] || []).push(s);
  });
  Object.keys(STATES).filter(function (c) { return groups[c]; }).forEach(function (code) {
    var head = document.createElement('h2');
    head.className = 'state-head';
    head.textContent = STATES[code];
    var list = document.createElement('ul');
    list.className = 'school-list';
    groups[code].sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (s) {
      var a = document.createElement('a');
      a.href = 'school.html?s=' + encodeURIComponent(s.id);
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.background = 'linear-gradient(' + s.band + ' 70%, ' + s.stripe + ' 70%)';
      var text = document.createElement('span');
      text.className = 'sum-text';
      var name = document.createElement('span');
      name.className = 'sum-title';
      name.textContent = s.name;
      var loc = document.createElement('span');
      loc.className = 'small muted';
      loc.textContent = s.location;
      text.append(name, loc);
      var chev = document.createElement('span');
      chev.className = 'chev';
      chev.setAttribute('aria-hidden', 'true');
      a.append(chip, text, chev);
      var li = document.createElement('li');
      li.dataset.search = (s.name + ' ' + s.id.replace(/-/g, ' ') + ' ' + s.location + ' ' + STATES[code]).toLowerCase();
      li.appendChild(a);
      list.appendChild(li);
    });
    var group = document.createElement('section');
    group.append(head, list);
    main.appendChild(group);
  });

  var input = document.getElementById('school-search');
  var empty = document.getElementById('no-match');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    var shown = 0;
    main.querySelectorAll('section').forEach(function (group) {
      var visible = 0;
      group.querySelectorAll('li').forEach(function (li) {
        var match = !q || li.dataset.search.indexOf(q) !== -1;
        li.hidden = !match;
        if (match) visible++;
      });
      group.hidden = visible === 0;
      shown += visible;
    });
    empty.hidden = shown !== 0;
  });
})();
</script>
</body>
</html>
